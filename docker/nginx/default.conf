server {
    listen 80;
    server_name localhost;

    # Importante: El root dentro del contenedor Nginx DEBE apuntar a la carpeta public
    root /var/www/html/public;
    index index.php index.html;

    location / {
        # Esta línea redirige todas las peticiones (/admin/login, /ticket/create, etc.) a index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000; # Nombre del servicio de PHP en tu docker-compose.yml
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquear acceso a archivos ocultos (.env, .htaccess, etc.)
    location ~ /\. {
        deny all;
    }
}