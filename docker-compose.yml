services:
  # Servidor Web (Nginx)
  web:
    image: nginx:alpine
    container_name: utic_web
    ports:
      - "${DB_EXTERNAL_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - utic_net

  # Procesador PHP-FPM
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: utic_php
    volumes:
      - ./:/var/www/html
    networks:
      - utic_net

 # Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: utic_db
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-utic_tickets_db}
      MYSQL_USER: ${DB_USER:-utic_user}
      MYSQL_PASSWORD: ${DB_PASS:-root}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      utic_net:
        aliases:
          - db
          - utic_db

networks:
  utic_net:
    driver: bridge

volumes:
  db_data:
    driver: local